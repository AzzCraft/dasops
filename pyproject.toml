[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasops"
version = "1.0.0"
description = "DAS + OpenSpec factory tooling (CLI + templates)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "DAS Ops Contributors" }
]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/AzzCraft/dasops"
Issues = "https://github.com/AzzCraft/dasops/issues"
Security = "https://github.com/AzzCraft/dasops/security/advisories/new"

[project.scripts]
dasops = "dasops.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dasops*"]
