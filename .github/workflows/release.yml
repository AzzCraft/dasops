name: release-validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact annotated v* tag to validate; run this workflow itself from the default branch"
        required: true
        type: string
      materials_artifact_id:
        description: "Prepared offline build materials artifact ID for 1.2.0-beta.1"
        required: false
        type: string
      materials_run_id:
        description: "Exact workflow run holding that materials artifact"
        required: false
        type: string
      materials_sha256:
        description: "Independently pinned raw build-materials.json SHA256"
        required: false
        type: string

# This workflow is intentionally non-publishing. The tag-source validation job
# is unprivileged; a fresh trusted job independently rebuilds the one archive
# it attests and cannot create or move a ref.
permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: "${{ steps.release_identity.outputs.version }}"
      tag: "${{ steps.release_identity.outputs.tag }}"
      tag_object: "${{ steps.release_identity.outputs.tag_object }}"
      commit: "${{ steps.release_identity.outputs.commit }}"
    steps:
      - name: Resolve immutable release tag
        id: release_ref
        shell: bash
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          REQUESTED_TAG: "${{ inputs.ref }}"
          WORKFLOW_REF: "${{ github.workflow_ref }}"
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == *"@refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "manual validation must run the workflow from the default branch" >&2
            exit 1
          }
          tag="$REQUESTED_TAG"
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          [[ "$tag" =~ ^v${semver}$ ]] || {
            echo "release validation accepts only a SemVer v* tag" >&2
            exit 1
          }
          printf 'tag=%s\nref=refs/tags/%s\n' "$tag" "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ steps.release_ref.outputs.ref }}"
      - name: Bind the checked-out annotated tag to VERSION
        id: release_identity
        shell: bash
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          TAG: "${{ steps.release_ref.outputs.tag }}"
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$TAG" == "v$version" ]] || {
            echo "tag $TAG does not match VERSION $version" >&2
            exit 1
          }
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          [[ "$(git cat-file -t "$tag_object")" == "tag" ]] || {
            echo "release tag must be an annotated tag" >&2
            exit 1
          }
          commit="$(git rev-parse "$TAG^{commit}")"
          [[ "$(git rev-parse HEAD^{commit})" == "$commit" ]] || {
            echo "checked-out source does not match the requested tag target" >&2
            exit 1
          }
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$commit" "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "release tag target is not reachable from the default branch" >&2
            exit 1
          }
          printf 'version=%s\ntag=%s\ntag_object=%s\ncommit=%s\n' \
            "$version" "$TAG" "$tag_object" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.11"
      - name: Configure an external verification environment
        shell: bash
        run: |
          set -euo pipefail
          verify_venv="$RUNNER_TEMP/dasops-verify-venv"
          printf 'VERIFY_VENV=%s\n' "$verify_venv" >> "$GITHUB_ENV"
      - name: Prepare Linux sandbox tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          # The sealed-memfd launcher needs user namespaces in this test runner.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true
      - name: Install verification environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$VERIFY_VENV"
          . "$VERIFY_VENV/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-verify.txt
          python -m pip install -e .
      - name: Verify public source
        shell: bash
        run: |
          set -euo pipefail
          . "$VERIFY_VENV/bin/activate"
          bash ./scripts/verify
      - name: Audit Python dependencies and source
        shell: bash
        run: |
          set -euo pipefail
          . "$VERIFY_VENV/bin/activate"
          pip-audit --progress-spinner off --strict -r requirements-verify.txt
          bandit -q -lll -r dasops
      - name: Build deterministic release evidence
        id: release_artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_identity.outputs.version }}"
          tag="${{ steps.release_identity.outputs.tag }}"
          tag_object="${{ steps.release_identity.outputs.tag_object }}"
          commit="${{ steps.release_identity.outputs.commit }}"
          artifact_dir="$RUNNER_TEMP/dasops-release-artifacts"
          archive_name="dasops-${version}-source.tar.gz"
          sbom_name="dasops-${version}.spdx.json"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$commit")"

          mkdir -p "$artifact_dir"
          git archive --format=tar --prefix="dasops-${version}/" "$commit" | gzip -n > "$artifact_dir/$archive_name"
          # Historical immutable tags predate the checked-in SBOM.  Generate a
          # deterministic SPDX source inventory from the exact checked-out
          # commit instead of copying a working-tree-only file.
          python3 - "$artifact_dir/$sbom_name" "dasops" "$version" "$commit" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          output, repository, version, commit = sys.argv[1:]

          def git_bytes(*arguments: str) -> bytes:
              return subprocess.check_output(["git", *arguments])

          timestamp = int(git_bytes("show", "-s", "--format=%ct", commit).decode("ascii").strip())
          created = datetime.fromtimestamp(timestamp, tz=timezone.utc).isoformat().replace("+00:00", "Z")
          entries = git_bytes("ls-tree", "-r", "-z", "--full-tree", commit).split(b"\0")
          files = []
          file_sha1s = []
          relationships = []
          for index, entry in enumerate(item for item in entries if item):
              metadata, raw_path = entry.split(b"\t", 1)
              mode, object_type, object_id = metadata.decode("ascii").split()
              if object_type != "blob":
                  continue
              file_id = f"SPDXRef-File-{index:06d}"
              contents = git_bytes("cat-file", "blob", object_id)
              sha1 = hashlib.sha1(contents).hexdigest()
              sha256 = hashlib.sha256(contents).hexdigest()
              file_sha1s.append(sha1)
              path = "./" + raw_path.decode("utf-8", "surrogateescape")
              files.append({
                  "SPDXID": file_id,
                  "checksums": [
                      {"algorithm": "SHA1", "checksumValue": sha1},
                      {"algorithm": "SHA256", "checksumValue": sha256},
                  ],
                  "copyrightText": "NOASSERTION",
                  "fileName": path,
                  "licenseConcluded": "NOASSERTION",
                  "licenseInfoInFiles": ["NOASSERTION"],
                  "noticeText": f"git mode {mode}",
              })
              relationships.append({
                  "spdxElementId": "SPDXRef-Package-Source",
                  "relationshipType": "CONTAINS",
                  "relatedSpdxElement": file_id,
              })

          package = {
              "SPDXID": "SPDXRef-Package-Source",
              "copyrightText": "NOASSERTION",
              "downloadLocation": "NOASSERTION",
              "filesAnalyzed": True,
              "licenseConcluded": "NOASSERTION",
              "licenseDeclared": "NOASSERTION",
              "name": repository,
              "packageVerificationCode": {
                  "packageVerificationCodeValue": hashlib.sha1(
                      "".join(sorted(file_sha1s)).encode("ascii")
                  ).hexdigest(),
              },
              "supplier": "NOASSERTION",
              "versionInfo": version,
          }
          payload = {
              "SPDXID": "SPDXRef-DOCUMENT",
              "creationInfo": {
                  "created": created,
                  "creators": ["Tool: DAS deterministic source SBOM generator"],
              },
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://github.com/AzzCraft/{repository}/sbom/{version}/{commit}",
              "files": files,
              "name": f"{repository}-{version}-source-inventory",
              "packages": [package],
              "relationships": [{
                  "spdxElementId": "SPDXRef-DOCUMENT",
                  "relationshipType": "DESCRIBES",
                  "relatedSpdxElement": "SPDXRef-Package-Source",
              }, *relationships],
              "spdxVersion": "SPDX-2.3",
          }
          Path(output).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 - "$artifact_dir/release-manifest.json" "$version" "$tag" "$tag_object" "$commit" "$archive_name" "$sbom_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, version, tag, tag_object, commit, archive, sbom = sys.argv[1:]
          payload = {
              "commit": commit,
              "repository": "dasops",
              "sbom": sbom,
              "sbomKind": "SPDX-2.3 deterministic source inventory from the exact commit",
              "sourceArchive": archive,
              "tag": tag,
              "tagObject": tag_object,
              "version": version,
          }
          Path(path).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          tar -tzf "$artifact_dir/$archive_name" >/dev/null
          mkdir -p "$artifact_dir/extracted"
          tar -xzf "$artifact_dir/$archive_name" -C "$artifact_dir/extracted"
          test -f "$artifact_dir/extracted/dasops-${version}/VERSION"
          (
            cd "$artifact_dir"
            while IFS= read -r artifact; do
              sha256sum "$artifact"
            done < <(printf '%s\n' "$archive_name" "$sbom_name" release-manifest.json | LC_ALL=C sort) > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          printf 'path=%s\nversion=%s\ntag=%s\ntag_object=%s\ncommit=%s\n' \
            "$artifact_dir" "$version" "$tag" "$tag_object" "$commit" >> "$GITHUB_OUTPUT"
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "dasops-release-validation-${{ steps.release_artifacts.outputs.version }}-${{ steps.release_artifacts.outputs.commit }}"
          path: "${{ steps.release_artifacts.outputs.path }}"
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  build_tools:
    name: build fixed beta tool without signing credentials
    needs: validate
    if: ${{ needs.validate.outputs.version == '1.2.0-beta.1' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: "${{ steps.upload_tools.outputs.artifact-id }}"
      control_commit: "${{ steps.tool_assets.outputs.control_commit }}"
      recipe_sha256: "${{ steps.tool_assets.outputs.recipe_sha256 }}"
      source_tree_sha256: "${{ steps.tool_assets.outputs.source_tree_sha256 }}"
      payload_sha256: "${{ steps.tool_assets.outputs.payload_sha256 }}"
      image_id: "${{ steps.tool_assets.outputs.image_id }}"
    steps:
      - name: Require pinned offline build inputs
        shell: bash
        env:
          MATERIAL_ID: "${{ inputs.materials_artifact_id }}"
          MATERIAL_RUN: "${{ inputs.materials_run_id }}"
          MATERIAL_SHA: "${{ inputs.materials_sha256 }}"
        run: |
          set -euo pipefail
          [[ "$MATERIAL_ID" =~ ^[0-9]+$ && "$MATERIAL_RUN" =~ ^[0-9]+$ && "$MATERIAL_SHA" =~ ^[0-9a-f]{64}$ ]]
      - name: Checkout reviewed build control
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          ref: "${{ github.event.repository.default_branch }}"
          path: build-control
      - name: Checkout candidate as data
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.ref }}"
          path: tag-source
      - name: Download pinned build materials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: "${{ inputs.materials_artifact_id }}"
          run-id: "${{ inputs.materials_run_id }}"
          github-token: "${{ github.token }}"
          path: "${{ runner.temp }}/tool-materials"
      - name: Build and install exact tool asset in isolated domains
        id: tool_assets
        shell: bash
        env:
          REQUESTED_TAG: "${{ inputs.ref }}"
          EXPECTED_COMMIT: "${{ needs.validate.outputs.commit }}"
          EXPECTED_TAG_OBJECT: "${{ needs.validate.outputs.tag_object }}"
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          MATERIAL_SHA: "${{ inputs.materials_sha256 }}"
        run: |
          set -euo pipefail
          version="$(git -C tag-source show HEAD:VERSION | tr -d '\r\n')"
          commit="$(git -C tag-source rev-parse "$REQUESTED_TAG^{commit}")"
          tag_object="$(git -C tag-source rev-parse "refs/tags/$REQUESTED_TAG")"
          [[ "$version" == '1.2.0-beta.1' && "$REQUESTED_TAG" == "v$version" ]]
          [[ "$(git -C tag-source cat-file -t "$tag_object")" == tag ]]
          [[ "$commit" == "$EXPECTED_COMMIT" && "$tag_object" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git -C tag-source rev-parse HEAD)" == "$commit" ]]
          git -C tag-source fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git -C tag-source merge-base --is-ancestor "$commit" "refs/remotes/origin/$DEFAULT_BRANCH"
          control="$(git -C build-control rev-parse HEAD)"
          python3 -I -B - "$commit" "$RUNNER_TEMP/tool-source" <<'PY'
          import os,subprocess,sys
          from pathlib import Path,PurePosixPath
          commit,out=sys.argv[1:];root=Path(out);root.mkdir()
          git=lambda *a:subprocess.check_output(['git','-C','tag-source',*a])
          for entry in filter(None,git('ls-tree','-r','-z','--full-tree',commit).split(b'\0')):
              meta,name=entry.split(b'\t',1);mode,kind,oid=meta.decode().split();name=name.decode('utf-8')
              p=PurePosixPath(name)
              if mode not in ('100644','100755') or kind!='blob' or p.is_absolute() or str(p)!=name or any(x in ('.','..') for x in p.parts):
                  raise SystemExit('nonregular/noncanonical candidate Git input')
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('xb') as f:f.write(git('cat-file','blob',oid))
              os.chmod(target,0o755 if mode=='100755' else 0o644)
          PY
          python3 -I -B build-control/tools/build_tool_assets.py --component dasops \
            --source "$RUNNER_TEMP/tool-source" --source-commit "$commit" --control-commit "$control" \
            --materials "$RUNNER_TEMP/tool-materials/build-materials.json" --materials-sha256 "$MATERIAL_SHA" \
            --materials-root "$RUNNER_TEMP/tool-materials" --out "$RUNNER_TEMP/tool-build" \
            > "$RUNNER_TEMP/tool-build-result.json"
          python3 -I -B - "$RUNNER_TEMP/tool-build-result.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          for field,key in [('control_commit','controlCommit'),('recipe_sha256','recipeSha256'),
                            ('source_tree_sha256','sourceTreeSha256'),('payload_sha256','payloadSha256'),('image_id','imageId')]:
              print(field+'='+r[key])
          PY
      - name: Upload protected build outputs
        id: upload_tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "dasops-derived-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}"
          path: "${{ runner.temp }}/tool-build/build-1/"
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest:
    name: attest trusted release evidence bundle
    needs: [validate, build_tools]
    if: ${{ always() && needs.validate.result == 'success' && (needs.build_tools.result == 'success' || needs.build_tools.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve trusted workflow and immutable release tag
        id: release_ref
        shell: bash
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          REQUESTED_TAG: "${{ inputs.ref }}"
          WORKFLOW_REF: "${{ github.workflow_ref }}"
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == *"@refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "manual validation must run the workflow from the default branch" >&2
            exit 1
          }
          [[ "$REQUESTED_TAG" == "${{ needs.validate.outputs.tag }}" ]] || {
            echo "validated tag output does not match requested tag" >&2
            exit 1
          }
          printf 'tag=%s\nref=refs/tags/%s\n' "$REQUESTED_TAG" "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ steps.release_ref.outputs.ref }}"
      - name: Independently bind trusted tag identity
        shell: bash
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          TAG: "${{ steps.release_ref.outputs.tag }}"
          EXPECTED_VERSION: "${{ needs.validate.outputs.version }}"
          EXPECTED_TAG_OBJECT: "${{ needs.validate.outputs.tag_object }}"
          EXPECTED_COMMIT: "${{ needs.validate.outputs.commit }}"
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          commit="$(git rev-parse "$TAG^{commit}")"
          [[ "$TAG" == "v$version" ]]
          [[ "$(git cat-file -t "$tag_object")" == "tag" ]]
          [[ "$(git rev-parse HEAD^{commit})" == "$commit" ]]
          [[ "$version" == "$EXPECTED_VERSION" && "$tag_object" == "$EXPECTED_TAG_OBJECT" && "$commit" == "$EXPECTED_COMMIT" ]]
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$commit" "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Download unprivileged validation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "dasops-release-validation-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}"
          path: "${{ runner.temp }}/release-artifacts"
      - name: Rebuild and bind the source archive without executing tag code
        id: trusted_artifact
        shell: bash
        env:
          VERSION: "${{ needs.validate.outputs.version }}"
          COMMIT: "${{ needs.validate.outputs.commit }}"
          TAG_OBJECT: "${{ needs.validate.outputs.tag_object }}"
          ARTIFACT_DIR: "${{ runner.temp }}/release-artifacts"
        run: |
          set -euo pipefail
          archive_name="dasops-${VERSION}-source.tar.gz"
          sbom_name="dasops-${VERSION}.spdx.json"
          archive="$ARTIFACT_DIR/$archive_name"
          sbom="$ARTIFACT_DIR/$sbom_name"
          [[ -f "$archive" && -f "$sbom" && -f "$ARTIFACT_DIR/SHA256SUMS" && -f "$ARTIFACT_DIR/release-manifest.json" ]]
          git archive --format=tar --prefix="dasops-${VERSION}/" "$COMMIT" | gzip -n > "$RUNNER_TEMP/rebuilt-source.tar.gz"
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$(sha256sum "$RUNNER_TEMP/rebuilt-source.tar.gz" | awk '{print $1}')" ]]
          (cd "$ARTIFACT_DIR" && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/extracted-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted-source"
          test -f "$RUNNER_TEMP/extracted-source/dasops-${VERSION}/VERSION"
          python3 - "$ARTIFACT_DIR/release-manifest.json" "$VERSION" "$COMMIT" "$TAG_OBJECT" <<'PY'
          import json, sys
          manifest, version, commit, tag_object = sys.argv[1:]
          data = json.load(open(manifest, encoding="utf-8"))
          assert data == {
              "commit": commit,
              "repository": "dasops",
              "sbom": f"dasops-{version}.spdx.json",
              "sbomKind": "SPDX-2.3 deterministic source inventory from the exact commit",
              "sourceArchive": f"dasops-{version}-source.tar.gz",
              "tag": f"v{version}",
              "tagObject": tag_object,
              "version": version,
          }
          PY
          python3 - "$sbom" "$VERSION" "$COMMIT" <<'PY'
          import hashlib, json, subprocess, sys
          from datetime import datetime, timezone

          sbom, version, commit = sys.argv[1:]
          git = lambda *args: subprocess.check_output(["git", *args])
          timestamp = int(git("show", "-s", "--format=%ct", commit).decode().strip())
          created = datetime.fromtimestamp(timestamp, tz=timezone.utc).isoformat().replace("+00:00", "Z")
          files, sha1s, relationships = [], [], []
          entries = [item for item in git("ls-tree", "-r", "-z", "--full-tree", commit).split(b"\0") if item]
          for index, entry in enumerate(entries):
              metadata, raw_path = entry.split(b"\t", 1)
              mode, kind, object_id = metadata.decode("ascii").split()
              if kind != "blob":
                  continue
              contents = git("cat-file", "blob", object_id)
              sha1 = hashlib.sha1(contents).hexdigest()
              sha1s.append(sha1)
              file_id = f"SPDXRef-File-{index:06d}"
              files.append({
                  "SPDXID": file_id,
                  "checksums": [
                      {"algorithm": "SHA1", "checksumValue": sha1},
                      {"algorithm": "SHA256", "checksumValue": hashlib.sha256(contents).hexdigest()},
                  ],
                  "copyrightText": "NOASSERTION",
                  "fileName": "./" + raw_path.decode("utf-8", "surrogateescape"),
                  "licenseConcluded": "NOASSERTION",
                  "licenseInfoInFiles": ["NOASSERTION"],
                  "noticeText": f"git mode {mode}",
              })
              relationships.append({"spdxElementId": "SPDXRef-Package-Source", "relationshipType": "CONTAINS", "relatedSpdxElement": file_id})
          expected = {
              "SPDXID": "SPDXRef-DOCUMENT",
              "creationInfo": {"created": created, "creators": ["Tool: DAS deterministic source SBOM generator"]},
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://github.com/AzzCraft/dasops/sbom/{version}/{commit}",
              "files": files,
              "name": f"dasops-{version}-source-inventory",
              "packages": [{
                  "SPDXID": "SPDXRef-Package-Source", "copyrightText": "NOASSERTION", "downloadLocation": "NOASSERTION",
                  "filesAnalyzed": True, "licenseConcluded": "NOASSERTION", "licenseDeclared": "NOASSERTION",
                  "name": "dasops",
                  "packageVerificationCode": {"packageVerificationCodeValue": hashlib.sha1("".join(sorted(sha1s)).encode("ascii")).hexdigest()},
                  "supplier": "NOASSERTION", "versionInfo": version,
              }],
              "relationships": [{"spdxElementId": "SPDXRef-DOCUMENT", "relationshipType": "DESCRIBES", "relatedSpdxElement": "SPDXRef-Package-Source"}, *relationships],
              "spdxVersion": "SPDX-2.3",
          }
          assert json.load(open(sbom, encoding="utf-8")) == expected, "untrusted SPDX inventory differs from trusted Git-object reconstruction"
          PY
          (
            cd "$ARTIFACT_DIR"
            while IFS= read -r artifact; do sha256sum "$artifact"; done \
              < <(printf '%s\n' "$archive_name" "$sbom_name" release-manifest.json | LC_ALL=C sort) \
              > "$RUNNER_TEMP/trusted-SHA256SUMS"
            cmp SHA256SUMS "$RUNNER_TEMP/trusted-SHA256SUMS"
          )
          bundle="$RUNNER_TEMP/dasops-${VERSION}-evidence.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$bundle" -C "$ARTIFACT_DIR" "$archive_name" "$sbom_name" release-manifest.json SHA256SUMS
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
      - name: Download protected tool asset by immutable artifact ID
        if: ${{ needs.validate.outputs.version == '1.2.0-beta.1' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: "${{ needs.build_tools.outputs.artifact_id }}"
          path: "${{ runner.temp }}/protected-tool"
      - name: Bind derived payload without executing candidate or compiler
        if: ${{ needs.validate.outputs.version == '1.2.0-beta.1' }}
        shell: bash
        env:
          VERSION: "${{ needs.validate.outputs.version }}"
          COMMIT: "${{ needs.validate.outputs.commit }}"
          CONTROL_COMMIT: "${{ needs.build_tools.outputs.control_commit }}"
          RECIPE_SHA: "${{ needs.build_tools.outputs.recipe_sha256 }}"
          SOURCE_TREE_SHA: "${{ needs.build_tools.outputs.source_tree_sha256 }}"
          PAYLOAD_SHA: "${{ needs.build_tools.outputs.payload_sha256 }}"
          IMAGE_ID: "${{ needs.build_tools.outputs.image_id }}"
          MATERIAL_SHA: "${{ inputs.materials_sha256 }}"
          TOOL_DIR: "${{ runner.temp }}/protected-tool"
          ARTIFACT_DIR: "${{ runner.temp }}/release-artifacts"
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          source=Path(os.environ['TOOL_DIR']);dest=Path(os.environ['ARTIFACT_DIR'])
          filename='dasops-1.2.0b1-py3-none-any.whl'
          def ordinary(name):
              p=source/name;i=p.lstat()
              if not stat.S_ISREG(i.st_mode) or i.st_nlink!=1 or not 0<i.st_size<=32*1024**2:
                  raise SystemExit('nonregular or oversized derived asset')
              return p.read_bytes()
          raw=ordinary('tool-build-binding.json')
          def pairs(items):
              r={}
              for k,v in items:
                  if k in r:raise SystemExit('duplicate binding key')
                  r[k]=v
              return r
          if len(raw)>65536:raise SystemExit('binding too large')
          r=json.loads(raw,object_pairs_hook=pairs);payload=ordinary(filename)
          expected=dict(schemaVersion='1.0.0',component='dasops',version=os.environ['VERSION'],
              sourceCommit=os.environ['COMMIT'],controlCommit=os.environ['CONTROL_COMMIT'],
              sourceTreeSha256=os.environ['SOURCE_TREE_SHA'],recipeSha256=os.environ['RECIPE_SHA'],
              materialsSha256=os.environ['MATERIAL_SHA'],imageId=os.environ['IMAGE_ID'],platform='linux/amd64',
              payload=filename,payloadSha256=os.environ['PAYLOAD_SHA'],payloadBytes=len(payload))
          if r!=expected or hashlib.sha256(payload).hexdigest()!=expected['payloadSha256']:
              raise SystemExit('protected derived asset identity or bytes differ')
          for name,data in [(filename,payload),('tool-build-binding.json',raw)]:
              with (dest/name).open('xb') as f:f.write(data)
          PY
          (
            cd "$ARTIFACT_DIR"
            for asset in dasops-1.2.0b1-py3-none-any.whl tool-build-binding.json; do sha256sum "$asset"; done >> SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/dasops-${VERSION}-evidence.tar" -C "$ARTIFACT_DIR" \
            "dasops-${VERSION}-source.tar.gz" "dasops-${VERSION}.spdx.json" release-manifest.json \
            SHA256SUMS dasops-1.2.0b1-py3-none-any.whl tool-build-binding.json
      - name: Attest trusted release evidence bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "${{ steps.trusted_artifact.outputs.bundle }}"
